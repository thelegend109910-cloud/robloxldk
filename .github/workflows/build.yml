name: RDP with PacketRiot

on:
  workflow_dispatch:

jobs:
  rdp-pr:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "YourStrongP@ssw0rd!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $password -FullName "RDP User" -Description "GitHub Actions RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Restart-Service TermService -Force

      - name: Download PacketRiot
        shell: powershell
        run: |
          $url = "https://packetriot.com/downloads/riot.exe"
          $output = "C:\riot.exe"
          Invoke-WebRequest -Uri $url -OutFile $output

      - name: Start PacketRiot Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath "C:\riot.exe" -ArgumentList "tunnel", "--tcp", "3389" -RedirectStandardOutput "C:\pr.log" -RedirectStandardError "C:\pr.err" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          Write-Host "=== PACKETRIOT LOG ==="
          Get-Content "C:\pr.log" -ErrorAction SilentlyContinue
          Get-Content "C:\pr.err" -ErrorAction SilentlyContinue
          Write-Host "======================"

      - name: Print Credentials
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "RDP READY"
          Write-Host "Check logs above for the tunnel URL"
          Write-Host "User = rdpuser"
          Write-Host "Pass = YourStrongP@ssw0rd!"
          Write-Host "========================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive..."
          }
