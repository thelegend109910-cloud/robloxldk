name: RDP with Serveo

on:
  workflow_dispatch:

jobs:
  rdp-serveo:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "YourStrongP@ssw0rd!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $password -FullName "RDP User" -Description "GitHub Actions RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Restart-Service TermService -Force

      - name: Start Serveo Tunnel
        shell: powershell
        run: |
          # Start SSH tunnel in background, capture logs
          $ssh = Start-Process -FilePath "ssh" -ArgumentList @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "ServerAliveInterval=60",
            "-o", "ServerAliveCountMax=3",
            "-R", "0:localhost:3389",
            "serveo.net"
          ) -RedirectStandardOutput "C:\serveo.log" -RedirectStandardError "C:\serveo.err" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 20
          Write-Host "=== SERVEO LOG ==="
          Get-Content "C:\serveo.log" -ErrorAction SilentlyContinue
          Get-Content "C:\serveo.err" -ErrorAction SilentlyContinue
          Write-Host "=================="

      - name: Print Credentials
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "RDP READY"
          Write-Host "Host: serveo.net"
          Write-Host "Port: check logs above for allocated port"
          Write-Host "User = rdpuser"
          Write-Host "Pass = YourStrongP@ssw0rd!"
          Write-Host "========================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive..."
          }
