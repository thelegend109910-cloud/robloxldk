      - name: Build unsigned IPA
        run: |
          cd DualCameraStreamer
          xcodebuild -project DualCameraStreamer.xcodeproj -scheme DualCameraStreamer -sdk iphoneos -configuration Release build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build"
          mkdir -p Payload
          cp -r build/DualCameraStreamer.app Payload/
          zip -r DualCamStreamer.ipa Payload/
          mv DualCamStreamer.ipa ../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCamStreamer.ipa
          path: DualCamStreamer.ipa
