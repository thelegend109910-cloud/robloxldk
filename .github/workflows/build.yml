name: RDP with Cloudflare TCP

on:
  workflow_dispatch:

jobs:
  rdp-cf:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "YourStrongP@ssw0rd!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $password -FullName "RDP User" -Description "GitHub Actions RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Restart-Service TermService -Force

      - name: Download cloudflared
        shell: powershell
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $output = "C:\cloudflared.exe"
          Invoke-WebRequest -Uri $url -OutFile $output

      - name: Start Cloudflare TCP Tunnel
        shell: powershell
        run: |
          # Start cloudflared with TCP protocol explicitly
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList @(
            "tunnel",
            "--no-autoupdate",
            "--protocol", "quic",
            "--url", "tcp://localhost:3389"
          ) -RedirectStandardOutput "C:\cf.log" -RedirectStandardError "C:\cf.err" -WindowStyle Hidden
          
          Start-Sleep -Seconds 25
          
          Write-Host "=== CLOUDFLARE LOG ==="
          $log = Get-Content "C:\cf.log" -ErrorAction SilentlyContinue
          $err = Get-Content "C:\cf.err" -ErrorAction SilentlyContinue
          Write-Host ($log -join "`n")
          Write-Host ($err -join "`n")
          Write-Host "======================"

      - name: Extract Tunnel URL
        shell: powershell
        run: |
          $log = Get-Content "C:\cf.log" -ErrorAction SilentlyContinue
          $err = Get-Content "C:\cf.err" -ErrorAction SilentlyContinue
          $all = $log + $err
          
          # Look for the tunnel URL
          $url = $all | Select-String -Pattern "https://.*\.trycloudflare\.com" | Select-Object -First 1
          if ($url) {
            Write-Host "TUNNEL URL: $url"
            # For TCP, we need to convert to tcp:// format
            $tcpUrl = $url -replace "https://", "tcp://"
            Write-Host "TCP URL: $tcpUrl"
          } else {
            Write-Host "No tunnel URL found in logs"
          }

      - name: Print Credentials
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "RDP READY"
          Write-Host "User = rdpuser"
          Write-Host "Pass = YourStrongP@ssw0rd!"
          Write-Host "========================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive..."
          }
