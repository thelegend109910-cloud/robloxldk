name: RDP with Cloudflare

on:
  workflow_dispatch:

jobs:
  rdp-cf:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "YourStrongP@ssw0rd!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $password -FullName "RDP User" -Description "GitHub Actions RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Restart-Service TermService -Force

      - name: Download cloudflared
        shell: powershell
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $output = "C:\cloudflared.exe"
          Invoke-WebRequest -Uri $url -OutFile $output

      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--no-autoupdate", "--url", "tcp://localhost:3389" -RedirectStandardOutput "C:\cf.log" -RedirectStandardError "C:\cf.err" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          Write-Host "=== CLOUDFLARE LOG ==="
          Get-Content "C:\cf.log" -ErrorAction SilentlyContinue
          Get-Content "C:\cf.err" -ErrorAction SilentlyContinue
          Write-Host "======================"

      - name: Print Credentials
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "RDP READY"
          Write-Host "Look above for: tcp://xxxx.trycloudflare.com:xxxxx"
          Write-Host "User = rdpuser"
          Write-Host "Pass = YourStrongP@ssw0rd!"
          Write-Host "========================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive..."
          }
