name: RDP with PacketRiot

on:
  workflow_dispatch:

jobs:
  rdp-pr:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "YourStrongP@ssw0rd!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $password -FullName "RDP User" -Description "GitHub Actions RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Restart-Service TermService -Force

      - name: Download PacketRiot
        shell: powershell
        run: |
          # Try multiple download sources
          $urls = @(
            "https://pktriot-dl-bucket.s3.amazonaws.com/releases/0.15.4/pktriot-windows-amd64-0.15.4.zip",
            "https://github.com/packetriot/packetriot/releases/download/0.15.4/pktriot-windows-amd64-0.15.4.zip"
          )
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              $zip = "$env:TEMP\pktriot.zip"
              Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 30
              Expand-Archive -Path $zip -DestinationPath "C:\pktriot" -Force
              Move-Item "C:\pktriot\pktriot.exe" "C:\pktriot.exe" -Force
              Write-Host "Downloaded successfully"
              break
            } catch {
              Write-Host "Failed: $_"
            }
          }
          if (-not (Test-Path "C:\pktriot.exe")) {
            throw "Failed to download PacketRiot"
          }

      - name: Configure PacketRiot
        shell: powershell
        run: |
          # Initialize without auth (free tier)
          & "C:\pktriot.exe" configure --url localhost:3389
          Start-Sleep -Seconds 5

      - name: Start PacketRiot Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath "C:\pktriot.exe" -ArgumentList "tunnel", "start" -RedirectStandardOutput "C:\pr.log" -RedirectStandardError "C:\pr.err" -WindowStyle Hidden
          Start-Sleep -Seconds 25
          Write-Host "=== PACKETRIOT LOG ==="
          Get-Content "C:\pr.log" -ErrorAction SilentlyContinue
          Get-Content "C:\pr.err" -ErrorAction SilentlyContinue
          Write-Host "======================"

      - name: Print Credentials
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "RDP READY"
          Write-Host "Check logs above for tunnel URL"
          Write-Host "User = rdpuser"
          Write-Host "Pass = YourStrongP@ssw0rd!"
          Write-Host "========================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive..."
          }
